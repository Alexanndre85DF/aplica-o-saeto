<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu acesso · SAETO SRE Gurupi</title>
  <link rel="stylesheet" href="/static/acesso.css?v=win98-11" />
</head>
<body>
  <main class="portal">
    <section class="win">
      <div class="win-title">
        <span class="win-icon" aria-hidden="true"></span>
        <span>Acesso do aplicador — SAETO</span>
        <span class="win-controls" aria-hidden="true">
          <span class="win-ctrl">_</span>
          <span class="win-ctrl">□</span>
          <span class="win-ctrl close">×</span>
        </span>
      </div>
      <div class="win-body">
        <header class="portal-brand">
          <span>SRE Gurupi · SAETO 2026</span>
          <strong>Acesso do aplicador</strong>
        </header>

        <section id="tela-login" class="card">
          <h1>Entre com seu CPF</h1>
          <p>Use o link que a SRE enviou e o CPF cadastrado. Aplicar e extra ficam em abas separadas.</p>
          <form id="form-login">
            <label>CPF
              <input id="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14" required />
            </label>
            <p id="erro-login" class="erro hidden"></p>
            <button type="submit">Entrar</button>
          </form>
        </section>

        <section id="tela-painel" class="hidden">
          <div class="card cabeca">
            <div>
              <p class="kicker" id="codigo-apl"></p>
              <h1 id="nome-apl"></h1>
              <p id="cpf-apl"></p>
            </div>
            <button type="button" class="ghost" id="btn-sair">Sair</button>
          </div>
          <div id="lista-apps"></div>
        </section>
      </div>
    </section>
  </main>
  <footer class="taskbar">
    <button type="button" class="start-btn" tabindex="-1">
      <span class="start-logo" aria-hidden="true"></span>
      Iniciar
    </button>
    <span class="task-btn ativo">Acesso do aplicador</span>
    <span class="assinatura">Criado por Alexandre Tolentino © 2026</span>
    <span class="tray"><span id="relogio">00:00</span></span>
  </footer>

  <div id="dlg-presentes" class="dlg-overlay hidden">
    <section class="win login-win">
      <div class="win-title">
        <span class="win-icon" aria-hidden="true"></span>
        <span>Confirmar aplicação</span>
        <button type="button" class="win-ctrl close" id="dlg-presentes-x" aria-label="Fechar">×</button>
      </div>
      <form id="form-presentes" class="login-body">
        <p id="dlg-presentes-escola"></p>
        <p>Total de estudantes: <b id="dlg-presentes-total">—</b></p>
        <label class="campo">Estudantes presentes
          <input id="dlg-presentes-n" type="number" min="0" step="1" required />
        </label>
        <p id="dlg-presentes-erro" class="erro hidden"></p>
        <button type="submit">Confirmar e salvar</button>
        <button type="button" class="ghost" id="dlg-presentes-cancelar">Cancelar</button>
      </form>
    </section>
  </div>

  <script src="/static/acesso.js?v=win98-11"></script>
</body>
</html>
