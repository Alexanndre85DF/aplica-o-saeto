<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu acesso · SAETO SRE Gurupi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/acesso.css" />
</head>
<body>
  <main class="portal">
    <header class="portal-brand">
      <span>SRE Gurupi · SAETO 2026</span>
      <strong>Acesso do aplicador</strong>
    </header>

    <section id="tela-login" class="card">
      <h1>Entre com seu CPF</h1>
      <p>Use o link que a SRE enviou e o CPF cadastrado. Você verá só as suas escolas e datas.</p>
      <form id="form-login">
        <label>CPF
          <input id="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14" required />
        </label>
        <p id="erro-login" class="erro hidden"></p>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <section id="tela-painel" class="hidden">
      <div class="card cabeca">
        <div>
          <p class="kicker" id="codigo-apl"></p>
          <h1 id="nome-apl"></h1>
          <p id="cpf-apl"></p>
        </div>
        <button type="button" class="ghost" id="btn-sair">Sair</button>
      </div>
      <div id="lista-apps"></div>
    </section>
  </main>
  <script src="/static/acesso.js?v=turma2"></script>
</body>
</html>
